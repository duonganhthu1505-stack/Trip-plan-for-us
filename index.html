<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2E1A11" id="app-theme-color" />
    <script>
      // Applied before React loads so the installed-app startup/splash screen
      // matches the saved Light/Dark preference (no light flash in Dark Mode).
      (function () {
        var CREAM = '#FAF7F2';
        var ESPRESSO = '#2E1A11';
        var dark = false;
        try {
          var raw = null;
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && /theme|darkmode|color-?scheme/i.test(k)) {
              raw = localStorage.getItem(k);
              if (raw) break;
            }
          }
          if (raw) {
            var v = String(raw).replace(/^"|"$/g, '').toLowerCase();
            if (v === 'dark' || v === 'true') dark = true;
            else if (v === 'light' || v === 'false') dark = false;
            else if (v.indexOf('"dark"') !== -1 || /"(theme|mode)":"dark"/.test(v)) dark = true;
            else if (v === 'system' || v === 'auto') {
              dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            }
          }
        } catch (e) {}
        var root = document.documentElement;
        root.style.backgroundColor = dark ? ESPRESSO : CREAM;
        root.style.setProperty('--app-splash-bg', dark ? ESPRESSO : CREAM);
        var tag = document.getElementById('app-theme-color');
        if (tag) tag.setAttribute('content', dark ? ESPRESSO : CREAM);
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Travel Planner" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <title>Our Travel Planner</title>
    <meta name="description" content="Romantic travel journal and trip planner for couples and solo adventurers with itinerary, budget tracker, wishlist, and checklists." />
    <meta property="og:title" content="Our Travel Planner" />
    <meta property="og:description" content="Romantic travel journal and trip planner for couples and solo adventurers with itinerary, budget tracker, wishlist, and checklists." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: var(--app-splash-bg, #2E1A11)" class="bg-[#FAF7F2] text-[#3D312A] antialiased selection:bg-[#E2D2C3] selection:text-[#362417]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
