  <path transform="translate(430 540) rotate(62) scale(.92) translate(-50 -50)" fill="#55423A"
        d="M50 2 C55 2 58 9 58 18 L58 36 L94 58 L94 68 L58 56 L58 76 L72 88 L72 96 L50 90 L28 96 L28 88 L42 76 L42 56 L6 68 L6 58 L42 36 L42 18 C42 9 45 2 50 2 Z"/>
  <path transform="translate(600 610) rotate(-28) scale(.78) translate(-50 -50)" fill="#C4685A"
