  <!-- globe -->
  <circle cx="470" cy="590" r="236" fill="#F1E9DD" stroke="#55423A" stroke-width="24"/>

  <!-- orbit ring front pass -->
  <path d="M 244 700 Q 396 800 570 776" fill="none" stroke="#55423A" stroke-width="20" stroke-linecap="round" clip-path="url(#e1-globe-clip)"/>

  <!-- two dotted routes converging at the pin -->
