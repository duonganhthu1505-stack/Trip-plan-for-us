<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="e1-globe-clip"><circle cx="470" cy="590" r="236"/></clipPath>
  </defs>

  <g id="icon-bg">
    <rect width="1024" height="1024" fill="#B9AA9B"/>
  </g>

  <!-- floating deco -->
