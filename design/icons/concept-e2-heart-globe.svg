<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="e2-heart-clip">
      <path transform="translate(512 540) scale(5.5) translate(-50 -48)"
            d="M50 88 C50 88 8 58 8 32 C8 17 19 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C81 8 92 17 92 32 C92 58 50 88 50 88 Z"/>
    </clipPath>
  </defs>

  <g id="icon-bg">
    <rect width="1024" height="1024" fill="#B9AA9B"/>
  </g>

  <!-- deco -->
  <g stroke="#55423A" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M132 216 v32 M116 232 h32"/>
    <path d="M900 764 v28 M886 778 h28"/>
  </g>
  <circle cx="880" cy="220" r="14" fill="#C4685A"/>
  <circle cx="140" cy="780" r="12" fill="#C4685A"/>

  <!-- orbit ring behind heart -->
  <ellipse cx="512" cy="540" rx="440" ry="150" fill="none" stroke="#55423A" stroke-width="20" transform="rotate(-14 512 540)"/>

  <!-- heart globe -->
  <path transform="translate(512 540) scale(5.5) translate(-50 -48)" fill="#F1E9DD" stroke="#55423A" stroke-width="4.6"
        d="M50 88 C50 88 8 58 8 32 C8 17 19 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C81 8 92 17 92 32 C92 58 50 88 50 88 Z"/>

  <!-- meridian lines, clipped to heart -->
  <g clip-path="url(#e2-heart-clip)" fill="none" stroke="#55423A" stroke-width="14" stroke-linecap="round" opacity=".85">
    <path d="M 512 296 C 420 420 420 620 512 764"/>
    <path d="M 512 296 C 604 420 604 620 512 764"/>
    <path d="M 292 500 C 420 560 604 560 732 500"/>
  </g>

  <!-- orbit front pass -->
  <path d="M 236 640 Q 420 748 640 716" fill="none" stroke="#55423A" stroke-width="20" stroke-linecap="round" clip-path="url(#e2-heart-clip)"/>

  <!-- dotted trails + planes on the orbit -->
