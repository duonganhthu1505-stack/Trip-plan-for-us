  <path d="M 928 628 A 440 150 -14 0 1 730 670" fill="none" stroke="#55423A" stroke-width="16" stroke-linecap="round" stroke-dasharray="0.1 42"/>
  <path transform="translate(722 676) rotate(-105) scale(.9) translate(-50 -50)" fill="#55423A"
        d="M50 2 C55 2 58 9 58 18 L58 36 L94 58 L94 68 L58 56 L58 76 L72 88 L72 96 L50 90 L28 96 L28 88 L42 76 L42 56 L6 68 L6 58 L42 36 L42 18 C42 9 45 2 50 2 Z"/>
